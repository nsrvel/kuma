[workspace]
resolver = "2"
members = [
    "crates/kuma-domain",
    "crates/kuma-protocol",
    "crates/kuma-application",
    "crates/kuma-client",
    "crates/kuma-store",
    "crates/kuma-exec",
    "crates/kuma-daemon",
    "kuma",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nsrvel/kuma"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
aes-gcm = "0.10"
getrandom = "0.2"
subtle = "2"
