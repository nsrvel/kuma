[package]
name = "kuma-daemon"
description = "Unix socket adapter and daemon runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kuma-application = { path = "../kuma-application" }
kuma-exec = { path = "../kuma-exec" }
kuma-protocol = { path = "../kuma-protocol" }
kuma-store = { path = "../kuma-store" }
anyhow.workspace = true
libc.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1", "query"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
subtle.workspace = true
base64 = "0.22"

[dev-dependencies]
kuma-client = { path = "../kuma-client" }
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
