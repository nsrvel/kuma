name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  dmg:
    name: Build DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Import code-signing certificate
        if: ${{ vars.ENABLE_RELEASE_CODESIGN == 'true' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Resolve Swift packages
        run: xcodebuild -project apps/mac/Kuma.xcodeproj -scheme Kuma -resolvePackageDependencies -clonedSourcePackagesDirPath apps/mac/.spm

      - name: Build release DMG
        env:
          DERIVED_DATA_PATH: ${{ github.workspace }}/apps/mac/build/DerivedData
          CLONED_SOURCE_PACKAGES_DIR: ${{ github.workspace }}/apps/mac/.spm
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
        run: |
          chmod +x apps/mac/Scripts/make-dmg.sh apps/mac/Scripts/mac-sign-app.sh apps/mac/Scripts/mac-notarize-dmg.sh
          ./apps/mac/Scripts/make-dmg.sh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mac/dist/Kuma-*.dmg
          generate_release_notes: true
